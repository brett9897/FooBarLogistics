services:
  env-check:
    image: alpine:latest
    command: >
      sh -c "
        if [ ! -f /config/.env ]; then
          echo '❌ .env file missing! Copy .env.template to .env first';
          exit 1;
        fi;
        echo '✅ Environment validated';
      "
    volumes:
      - .:/config

  db:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    env_file:
      - .env.common
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: ${MULTIPLE_DB_NAMES}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    depends_on:
      env-check:
        condition: service_completed_successfully
volumes:
    postgres_data: